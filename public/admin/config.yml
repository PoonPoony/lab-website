# =============================================================
#  관리자 페이지 설정 (Sveltia CMS)
#
#  ⚠️ 아래 repo 항목을 본인의 GitHub 저장소로 반드시 바꿔주세요.
#     예) repo: yhjung105/lab-website
# =============================================================

backend:
  name: github
  repo: PoonPoony/lab-website
  branch: main
  # 학생들도 로그인해서 글을 쓰게 하려면 아래 두 줄의 주석을 풀고
  # Cloudflare Workers에 인증 도우미를 배포한 주소를 넣으세요. (가이드 5단계 참고)
  # base_url: https://sveltia-cms-auth.your-account.workers.dev
  # auth_endpoint: auth

# 글을 저장하면 GitHub에 남는 커밋 메시지
site_url: https://lab-website.yhjung105.workers.dev
display_url: https://lab-website.yhjung105.workers.dev
publish_mode: simple

# 업로드한 사진이 저장되는 위치
media_folder: public/images
public_folder: /images

# 한국어 / 영어를 나란히 놓고 작성할 수 있게 합니다.
i18n:
  structure: multiple_folders
  locales: [ko, en]
  default_locale: ko

collections:
  # ---------------------------------------------------------
  # 공지사항
  # ---------------------------------------------------------
  - name: news
    label: 공지사항
    label_singular: 공지
    folder: src/content/news
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    sortable_fields: [date, title]
    i18n: true
    fields:
      - { name: title, label: 제목, widget: string, i18n: true }
      - { name: date, label: 작성일, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false, i18n: duplicate }
      - name: category
        label: 분류
        widget: select
        default: notice
        i18n: duplicate
        options:
          - { label: 공지, value: notice }
          - { label: 수상, value: award }
          - { label: 행사, value: event }
      - { name: pinned, label: 상단 고정, widget: boolean, default: false, required: false, i18n: duplicate }
      - { name: summary, label: 한 줄 요약, widget: text, required: false, i18n: true }
      - { name: thumbnail, label: 대표 사진, widget: image, required: false, i18n: duplicate }
      - { name: body, label: 본문, widget: markdown, i18n: true }

  # ---------------------------------------------------------
  # 갤러리 (사진 앨범)
  # ---------------------------------------------------------
  - name: gallery
    label: 갤러리
    label_singular: 앨범
    folder: src/content/gallery
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    sortable_fields: [date, title]
    i18n: true
    fields:
      - { name: title, label: 제목, widget: string, i18n: true }
      - { name: date, label: 날짜, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false, i18n: duplicate }
      - { name: summary, label: 한 줄 설명, widget: text, required: false, i18n: true }
      - { name: cover, label: 대표 사진, widget: image, required: false, i18n: duplicate }
      - name: photos
        label: 사진
        widget: list
        required: false
        i18n: duplicate
        field: { name: image, label: 사진, widget: image }
      - { name: body, label: 설명 (선택), widget: markdown, required: false, i18n: true }

  # ---------------------------------------------------------
  # 구성원
  # ---------------------------------------------------------
  - name: members
    label: 구성원
    label_singular: 구성원
    folder: src/content/members
    create: true
    slug: '{{slug}}'
    sortable_fields: [order, name]
    i18n: true
    fields:
      - { name: name, label: 이름, widget: string, i18n: true }
      - name: role
        label: 구분
        widget: select
        default: ms
        i18n: duplicate
        options:
          - { label: 지도교수, value: professor }
          - { label: 박사후연구원, value: postdoc }
          - { label: 박사과정, value: phd }
          - { label: 석사과정, value: ms }
          - { label: 학부연구생, value: undergrad }
          - { label: 졸업생, value: alumni }
      - { name: position, label: 직위 / 학년, widget: string, required: false, i18n: true }
      - { name: topic, label: 연구 주제, widget: string, required: false, i18n: true }
      - { name: email, label: 이메일, widget: string, required: false, i18n: duplicate }
      - { name: photo, label: 사진, widget: image, required: false, i18n: duplicate }
      - { name: order, label: 표시 순서 (작을수록 먼저), widget: number, default: 1, value_type: int, i18n: duplicate }
      - name: education
        label: 학력 (지도교수용)
        widget: list
        required: false
        i18n: true
        label_singular: 학력
        summary: '{{fields.period}} {{fields.text}}'
        fields:
          - { name: period, label: 연도, widget: string, required: false, hint: '예) 2015' }
          - { name: text, label: 내용, widget: string, hint: '예) 서울대학교 전기공학 박사' }
      - name: career
        label: 경력 (지도교수용)
        widget: list
        required: false
        i18n: true
        label_singular: 경력
        summary: '{{fields.period}} {{fields.text}}'
        fields:
          - { name: period, label: 기간, widget: string, required: false, hint: '예) 2018–2022' }
          - { name: text, label: 내용, widget: string, hint: '예) 현대자동차 책임연구원' }
      - name: activities
        label: 활동 (지도교수용)
        widget: list
        required: false
        i18n: true
        label_singular: 활동
        summary: '{{fields.period}} {{fields.text}}'
        hint: '위원 · 지도 등 맡으신 역할. 예) 서울시 공무원 시험출제위원'
        fields:
          - { name: period, label: 기간, widget: string, required: false, hint: '예) 2024' }
          - { name: text, label: 내용, widget: string }
      - name: links
        label: 외부 링크
        widget: list
        required: false
        i18n: duplicate
        fields:
          - { name: label, label: 이름, widget: string }
          - { name: url, label: 주소, widget: string }
      - { name: body, label: 소개 (선택), widget: markdown, required: false, i18n: true }

  # ---------------------------------------------------------
  # 연구 분야
  # ---------------------------------------------------------
  - name: research
    label: 연구 분야
    label_singular: 연구 분야
    folder: src/content/research
    create: true
    slug: '{{slug}}'
    sortable_fields: [order, title]
    i18n: true
    fields:
      - { name: title, label: 분야명, widget: string, i18n: true }
      - { name: summary, label: 한 줄 설명, widget: text, i18n: true }
      - { name: order, label: 표시 순서, widget: number, default: 1, value_type: int, i18n: duplicate }
      - name: keywords
        label: 키워드
        widget: list
        required: false
        i18n: true
        field: { name: keyword, label: 키워드, widget: string }
      - { name: body, label: 상세 설명, widget: markdown, i18n: true }

  # ---------------------------------------------------------
  # 국제학술지
  # ---------------------------------------------------------
  - name: pub_intl_journal
    label: 국제학술지
    label_singular: 논문
    folder: src/content/publications
    create: true
    filter: { field: type, value: intl-journal }
    slug: 'intl-journal-{{slug}}'
    sortable_fields: [date, title]
    fields:
      - { name: type, label: 종류, widget: hidden, default: intl-journal }
      - { name: title, label: 제목, widget: string }
      - { name: authors, label: 저자, widget: string, hint: '예) M. Kim, S. Lee, and Y.-H. Jung' }
      - { name: venue, label: 게재처 / 권·호·페이지, widget: string }
      - name: date
        label: 게재 연월
        widget: string
        required: false
        hint: 'YYYY-MM 형식. 예) 2026-03'
        pattern: ['^\d{4}-\d{2}$', 'YYYY-MM 형식으로 적어주세요. 예) 2026-03']
      - { name: doi, label: DOI, widget: string, required: false, hint: '예) 10.1109/TIA.2026.0000000' }
      - { name: link, label: 원문 링크, widget: string, required: false }
      - { name: body, label: 초록 · 설명 (선택), widget: markdown, required: false, hint: '여기에 쓴 내용이 상세 페이지에 나옵니다.' }

  # ---------------------------------------------------------
  # 국제학술대회
  # ---------------------------------------------------------
  - name: pub_intl_conf
    label: 국제학술대회
    label_singular: 논문
    folder: src/content/publications
    create: true
    filter: { field: type, value: intl-conf }
    slug: 'intl-conf-{{slug}}'
    sortable_fields: [date, title]
    fields:
      - { name: type, label: 종류, widget: hidden, default: intl-conf }
      - { name: title, label: 제목, widget: string }
      - { name: authors, label: 저자, widget: string, hint: '예) M. Kim, S. Lee, and Y.-H. Jung' }
      - { name: venue, label: 게재처 / 권·호·페이지, widget: string }
      - name: date
        label: 게재 연월
        widget: string
        required: false
        hint: 'YYYY-MM 형식. 예) 2026-03'
        pattern: ['^\d{4}-\d{2}$', 'YYYY-MM 형식으로 적어주세요. 예) 2026-03']
      - { name: doi, label: DOI, widget: string, required: false, hint: '예) 10.1109/TIA.2026.0000000' }
      - { name: link, label: 원문 링크, widget: string, required: false }
      - { name: body, label: 초록 · 설명 (선택), widget: markdown, required: false, hint: '여기에 쓴 내용이 상세 페이지에 나옵니다.' }

  # ---------------------------------------------------------
  # 국내학술대회
  # ---------------------------------------------------------
  - name: pub_domestic_conf
    label: 국내학술대회
    label_singular: 논문
    folder: src/content/publications
    create: true
    filter: { field: type, value: domestic-conf }
    slug: 'domestic-conf-{{slug}}'
    sortable_fields: [date, title]
    fields:
      - { name: type, label: 종류, widget: hidden, default: domestic-conf }
      - { name: title, label: 제목, widget: string }
      - { name: authors, label: 저자, widget: string, hint: '예) M. Kim, S. Lee, and Y.-H. Jung' }
      - { name: venue, label: 게재처 / 권·호·페이지, widget: string }
      - name: date
        label: 게재 연월
        widget: string
        required: false
        hint: 'YYYY-MM 형식. 예) 2026-03'
        pattern: ['^\d{4}-\d{2}$', 'YYYY-MM 형식으로 적어주세요. 예) 2026-03']
      - { name: doi, label: DOI, widget: string, required: false, hint: '예) 10.1109/TIA.2026.0000000' }
      - { name: link, label: 원문 링크, widget: string, required: false }
      - { name: body, label: 초록 · 설명 (선택), widget: markdown, required: false, hint: '여기에 쓴 내용이 상세 페이지에 나옵니다.' }

  # ---------------------------------------------------------
  # 특허
  # ---------------------------------------------------------
  - name: pub_patent
    label: 특허
    label_singular: 특허
    folder: src/content/publications
    create: true
    filter: { field: type, value: patent }
    slug: 'patent-{{slug}}'
    sortable_fields: [date, title]
    fields:
      - { name: type, label: 종류, widget: hidden, default: patent }
      - { name: title, label: 특허명, widget: string }
      - { name: authors, label: 발명자, widget: string, hint: '예) 정영훈, 김민수' }
      - { name: venue, label: 등록 / 출원 번호, widget: string, hint: '예) 대한민국 등록특허 10-2024-0000000' }
      - name: date
        label: 등록 연월
        widget: string
        required: false
        hint: 'YYYY-MM 형식. 예) 2024-05'
        pattern: ['^\d{4}-\d{2}$', 'YYYY-MM 형식으로 적어주세요. 예) 2024-05']
      - { name: link, label: 관련 링크, widget: string, required: false }
      - { name: body, label: 설명 (선택), widget: markdown, required: false }

  # ---------------------------------------------------------
  # 연구과제
  # ---------------------------------------------------------
  - name: pub_project
    label: 연구과제
    label_singular: 과제
    folder: src/content/publications
    create: true
    filter: { field: type, value: project }
    slug: 'project-{{slug}}'
    sortable_fields: [start, title]
    fields:
      - { name: type, label: 종류, widget: hidden, default: project }
      - { name: title, label: 과제명, widget: string }
      - { name: authors, label: 역할, widget: string, hint: '예) 연구책임자: 정영훈' }
      - { name: venue, label: 지원기관 / 사업명, widget: string, hint: '예) 한국연구재단 중견연구자지원사업' }
      - name: start
        label: 시작 연월
        widget: string
        required: false
        hint: '예) 2023-06'
        pattern: ['^\d{4}-\d{2}$', 'YYYY-MM 형식으로 적어주세요. 예) 2023-06']
      - name: end
        label: 종료 연월
        widget: string
        required: false
        hint: '예) 2026-05'
        pattern: ['^\d{4}-\d{2}$', 'YYYY-MM 형식으로 적어주세요. 예) 2026-05']
      - name: fund
        label: 지원 구분
        widget: select
        required: false
        options:
          - { label: 정부지원과제, value: gov }
          - { label: 기관·기업지원과제, value: org }
      - { name: link, label: 관련 링크, widget: string, required: false }
      - { name: body, label: 설명 (선택), widget: markdown, required: false }
